20cx%3D%2723%27%20cy%3D%2730.6%27%20r%3D%271.1%27%20fill%3D%27%23ffd24a%27/%3E%3Ccircle%20cx%3D%2721%27%20cy%3D%2741%27%20r%3D%27.8%27%20fill%3D%27%23ff3b55%27/%3E%3Ccircle%20cx%3D%2725.5%27%20cy%3D%2744.5%27%20r%3D%27.8%27%20fill%3D%27%23ffd24a%27/%3E%3Cpath%20d%3D%27M0%2056Q22%2049%2050%2057V70H0Z%27%20fill%3D%27%23fff%27/%3E%3Cg%20fill%3D%27%23fff%27%20opacity%3D%27.85%27%3E%3Ccircle%20cx%3D%2712%27%20cy%3D%2720%27%20r%3D%27.8%27/%3E%3Ccircle%20cx%3D%2730%27%20cy%3D%2722%27%20r%3D%27.7%27/%3E%3Ccircle%20cx%3D%2742%27%20cy%3D%2734%27%20r%3D%27.8%27/%3E%3Ccircle%20cx%3D%274%27%20cy%3D%2736%27%20r%3D%27.7%27/%3E%3Ccircle%20cx%3D%2716%27%20cy%3D%2760%27%20r%3D%27.6%27/%3E%3Ccircle%20cx%3D%2738%27%20cy%3D%2762%27%20r%3D%27.7%27/%3E%3C/g%3E%3C/svg%3E") center/100% 100% no-repeat,#1d3f72}

body{margin:0;min-height:100vh;color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200%200%20%200%200%200%20.55%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E") ,radial-gradient(130% 85% at 50% 18%,var(--felt1),var(--felt2) 75%) fixed;background-size:180px 180px,auto;background-blend-mode:soft-light,normal;transition:background .4s;
  padding:calc(14px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}
body.ingame{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
body.lock{overflow:hidden}
.wrap{max-width:520px;margin:0 auto}
h1,h2{margin:0;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
/* Boutons en verre : flou de l'arrière-plan, reflet en haut, liseré clair */
.btn{border-radius:18px;padding:15px 18px;font-weight:700;font-size:16px;color:var(--ink);
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 6px 18px rgba(0,0,0,.22);transition:transform .08s,background .2s}
.btn.gold{position:relative;overflow:hidden;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
  background:linear-gradient(180deg,rgba(255,255,255,.36),rgba(255,255,255,.14) 55%,rgba(255,255,255,.2));
  border:1px solid rgba(255,255,255,.55);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.25),inset 0 -10px 22px rgba(255,255,255,.08),0 10px 28px rgba(0,0,0,.32)}
body:not([data-felt="casino"]) .btn.gold:before{content:"";position:absolute;left:1px;right:1px;top:1px;height:50%;border-radius:17px 17px 0 0;
  background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,0));pointer-events:none}
.btn.gold:after{content:none}
@keyframes sheen{0%,60%{left:-60%}100%{left:130%}}
.btn.red{background:linear-gradient(180deg,rgba(255,110,122,.82),rgba(214,48,64,.72));border:1px solid rgba(255,190,195,.6);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 10px 26px rgba(160,20,35,.35)}
.btn.green{background:linear-gradient(180deg,rgba(96,232,160,.82),rgba(28,160,92,.74));border:1px solid rgba(190,255,215,.6);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.5),0 10px 26px rgba(10,110,55,.35)}
.btn.block{width:100%;display:block}
.btn.lg{padding:19px 14px;font-size:19px;min-height:62px}
.btn:active,.pbtn:active,.mode:active,.segb:active{transform:scale(.97)}
.btn:disabled{opacity:.38;box-shadow:none}
.btn.gold:not(:disabled):active{background:linear-gradient(180deg,rgba(255,255,255,.46),rgba(255,255,255,.22))}
.link{display:block;margin:12px auto 0;color:var(--mute);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px}
.hint{color:color-mix(in srgb,var(--mute) 70%,#fff);font-size:15.5px;line-height:1.4;margin:6px 0 12px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);font-weight:600}
.big{font-size:30px;font-weight:800;line-height:1.05;margin-top:2px}
.gold{color:var(--gold)}
.center{text-align:center}
.panel{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--goldline);box-shadow:0 10px 30px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.06);border-radius:20px;padding:16px;margin-top:12px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--mute)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:8px;margin-top:14px}

/* ---------- Cartes ---------- */
.pc{--w:92px;position:relative;width:var(--w);aspect-ratio:5/7;font-size:calc(var(--w) / 6);border-radius:.6em;background:linear-gradient(160deg,#fffef9,#f7f1e3);color:#1c1c1c;
  box-shadow:0 10px 24px rgba(0,0,0,.4);font-family:Georgia,"Times New Roman",serif;flex:none;overflow:hidden;font-variant-emoji:text}
.cardback,.pc.back{background:
  repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 2px,transparent 2px 7px),
  repeating-linear-gradient(-45deg,rgba(255,255,255,.09) 0 2px,transparent 2px 7px),
  linear-gradient(135deg,var(--cb1,#8c2232),var(--cb2,#4c0d18));
  box-shadow:inset 0 0 0 3px #fffdf6,inset 0 0 0 4px rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.35)}
.pc.red{color:#c81e3a}
.pc .ci{position:absolute;font-weight:700;font-size:.88em;line-height:.9;font-family:'Playfair Display',Georgia,serif;display:flex;flex-direction:column;align-items:center;letter-spacing:-.06em}
.pc .ci i{font-style:normal;font-size:.85em;letter-spacing:0}
.pc .tl{top:.3em;left:.3em}.pc .br{bottom:.3em;right:.3em;transform:rotate(180deg)}
.pip{position:absolute;font-size:1.5em;line-height:1;transform:translate(-50%,-50%)}
.pip.f{transform:translate(-50%,-50%) rotate(180deg)}
.pip.ace{font-size:3.6em}
.court{position:absolute;left:13.5%;top:9.5%;width:73%;height:81%;display:block}
.acering{position:absolute;left:50%;top:50%;width:3.9em;height:3.9em;margin:-1.95em 0 0 -1.95em;border-radius:50%;border:.06em solid currentColor;opacity:.35}
.acering:after{content:"";position:absolute;inset:.22em;border-radius:50%;border:.03em dashed currentColor}
.pc.sm{--w:62px}
.pc.xs{--w:34px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pc.lg{--w:min(37vw,150px)}
.pc.xl{--w:var(--xlw,160px)}
.pc.hl{outline:3px solid var(--gold);outline-offset:2px}
.pc.dim{opacity:.32}
.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{transform:rotateY(90deg) scale(.85);opacity:.2}to{transform:none;opacity:1}}
.grid4{display:grid;grid-template-columns:repeat(2,auto);gap:12px;justify-content:center}
@media (orientation:portrait){.grid4>:last-child:nth-child(odd){grid-column:1/-1;justify-self:center}}

/* ---------- Accueil ---------- */
.hero{position:relative;text-align:center;padding:34px 0 2px}
.sign{display:inline-flex;flex-direction:column;align-items:center;margin-top:4px}
.sign .la{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:15px;letter-spacing:.55em;margin-right:-.55em;text-transform:uppercase;color:var(--gold);opacity:.9}
.sign .sub{display:flex;align-items:center;gap:12px;font-size:11.5px;font-weight:700;letter-spacing:.32em;margin-right:-.32em;text-transform:uppercase;color:var(--mute);margin-top:8px}
.sign .sub:before,.sign .sub:after{content:"";width:30px;height:1px;background:var(--gold);opacity:.6}
.sign .sub.xo{display:none}
body[data-felt="xmas"] .sign .sub.xo{display:flex}
@keyframes bulbs{50%{border-color:#fff3c4}}
.hero h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;letter-spacing:-.01em;line-height:1;color:#f4cf6a;text-shadow:0 2px 0 #7a5513,0 8px 22px rgba(0,0,0,.5)}

  background:rgba(0,0,0,.35);border:2px solid color-mix(in srgb,var(--gold) 45%,transparent);color:var(--gold);font-size:16px;font-weight:800;display:grid;place-items:center;transition:.3s}

.flip{position:absolute;inset:0;transition:transform .6s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}

.side{position:absolute;inset:0;border-radius:6px;-webkit-backface-visibility:hidden;backface-visibility:hidden}

 45%{transform:scale(1.25) rotate(7deg)}55%{transform:scale(1.28) rotate(-9deg)}65%{transform:scale(1.3) rotate(10deg)}75%{transform:scale(1.33) rotate(-11deg)}

.glass{width:100%;filter:drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.glasswrap span{margin-top:2px;font-weight:800;color:var(--gold);font-size:14px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.glassmini{width:70px;margin:10px auto 0}.bigglass{width:100%}
.turn{display:flex;align-items:center;gap:12px}.turn .av{width:46px;height:46px;font-size:20px}
.powers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.power{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid var(--goldline);text-align:center}
.power.none{opacity:.5}
.power .pk{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:.06em}
.power .pt{font-weight:800;font-size:14px}
.power .ph2{display:flex;align-items:center;gap:5px;font-size:13px;min-height:26px}.power .ph2 .av{width:22px;height:22px;font-size:11px}.power .ph2 i{color:var(--mute)}
.chut{font-size:34px}.chut.gold{color:var(--gold)}.chut.bad{color:#ff8f99}.chut.mute{color:var(--mute)}
.flash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 95%,transparent),color-mix(in srgb,var(--gold2) 97%,transparent));color:var(--onacc);animation:flash .35s ease-out;padding:30px}
.flash .fw{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(28px,9.4vw,96px);line-height:1;margin:6px 0 12px}
.flash p{font-size:18px;font-weight:700;max-width:420px;margin:0 auto}
@keyframes flash{from{transform:scale(1.25);opacity:0}}
.pv-chu{width:150px;height:140px;padding:0;background:none;box-shadow:none}
.pv-chu .pcc{position:absolute;left:50%;top:50%;margin:-16px 0 0 -11px;transform-origin:11px 16px}
.pv-chu .pcc .pc{--w:22px}
.pv-chu .pglass{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff}.pv-chu .pglass .ico{width:34px;height:34px}

/* Mode spectateur */
@media (max-width:430px){.icon.live .lw{display:none}.icon.live b{margin-left:0}.icons{gap:5px}.icon.wide{padding:0 10px}}
@media (max-width:380px){#peekBtn .lw{display:none}#peekBtn .ico{margin-right:0}}
.icon.live{color:#fff;border-color:rgba(255,255,255,.6);background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.12)),var(--glass)}.icon.live b{margin-left:5px;letter-spacing:.12em}
.bigcode{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:64px;letter-spacing:.18em;color:var(--gold);margin:6px 0 8px}
.specbar{display:none;position:fixed;left:0;right:0;top:0;z-index:60;padding:calc(6px + env(safe-area-inset-top)) 14px 6px;background:rgba(0,0,0,.72);
  align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:#fff}
.specbar b{color:var(--gold);letter-spacing:.12em}
.specbar button{padding:7px 14px;border-radius:10px;background:rgba(255,255,255,.14);font-weight:800}
body.spectator .specbar{display:flex}
body.spectator{padding-top:calc(52px + env(safe-area-inset-top))}
body.spectator .icons,body.spectator #dock,body.spectator .stage .acts,body.spectator .pyrbtn,body.spectator .sx,body.spectator .sfoot,body.spectator .sgrab{display:none!important}
body.spectator .stage{top:calc(40px + env(safe-area-inset-top))}
body.spectator .ov{pointer-events:none}
body.spectator #action .btn,body.spectator .power+.power~x{display:none}
body.spectator .ov:has(.spec-ok){pointer-events:auto}

/* barre d'action fixe */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:14px 14px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(var(--dockc),0),rgba(var(--dockc),.95) 28%)}
.dock .in{max-width:520px;margin:0 auto}

/* ---------- Feuilles ---------- */
.ov{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:540px;max-height:calc(var(--vh,100vh) - env(safe-area-inset-top) - 16px);overflow:auto;background:linear-gradient(180deg,var(--deep),var(--deep2));border-top:1px solid var(--goldline);border:1px solid var(--line);border-bottom:0;
  border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.8,.2,1)}
.ov.still,.ov.still .sheet{animation:none}
@keyframes up{from{transform:translateY(100%)}}
.shead{position:sticky;top:-10px;z-index:3;margin:-10px -18px 4px;padding:12px 12px 8px;min-height:56px;display:flex;justify-content:center;align-items:flex-start;background:var(--deep);border-radius:26px 26px 0 0;touch-action:none}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(255,255,255,.25);margin:2px 0 0}
.sx{position:absolute;right:12px;top:9px;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid var(--line);font-weight:800;font-size:17px}
.sheet h2{font-size:22px;margin-bottom:4px}
.who{display:flex;align-items:center;justify-content:center;gap:10px;font-size:28px;font-weight:800;margin:10px 0 2px}
.who .av{width:42px;height:42px;font-size:19px}
.hand{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.nocard{padding:22px;border:2px dashed var(--line);border-radius:14px;color:var(--mute);font-weight:600}
.verdict{text-align:center;font-size:21px;font-weight:800;padding:14px;border-radius:16px;margin:4px 0 14px;animation:pop .4s both}
.verdict small{display:block;font-size:16px;font-weight:700;margin-top:4px;opacity:.95}
.verdict.bad{background:rgba(239,77,90,.2);color:#ff8f99}
.verdict.ok{background:rgba(61,220,132,.16);color:var(--green)}
.verdict.wait{visibility:hidden;animation:none}
.cost{background:rgba(239,77,90,.18);color:#ffb3ba;border-radius:14px;padding:11px 12px;font-weight:800;margin:10px 0 0;text-align:center;font-size:16px}
.hold{position:relative;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;border-radius:20px;background:rgba(0,0,0,.25);border:1px dashed rgba(255,255,255,.2);padding:14px 8px;margin:14px 0;cursor:pointer}
.hold .reveal{display:none}
/* les cartes s'adaptent à la hauteur de l'écran : le bouton reste toujours visible */
.hold .pc.lg{--w:max(64px,min(37vw,150px,calc((var(--vh,100vh) - 370px) / (var(--hr,2) * 1.42))))}
.hold{margin:10px 0;padding:10px 8px}
.holdtxt{margin-top:8px}
.hbar{height:6px;border-radius:9px;background:rgba(0,0,0,.35);margin:10px 12px 0;overflow:hidden}
.hbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--gold2),var(--gold))}
.pbtn .wait{color:var(--mute);font-variant-numeric:tabular-nums;font-size:13px}
.hold.expired{cursor:not-allowed}.hold.expired .cover{opacity:.35}.hold.expired .holdtxt{color:#ff8f99}
.sfoot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom));z-index:4;margin:0 -18px calc(-24px - env(safe-area-inset-bottom));
  padding:10px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,transparent,var(--deep2) 22%)}
.hold.show .reveal{display:grid}.hold.show .cover{display:none}
.holdtxt{text-align:center;font-weight:700;color:var(--gold);margin-top:12px;font-size:15px}
.hold.show .holdtxt{visibility:hidden}
.rules{padding-left:0;list-style:none;margin:12px 0 16px;display:grid;gap:10px}
.rules li{background:rgba(255,255,255,.05);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:15px}
.rules b{color:var(--gold)}

/* ---------- Scène plein écran ---------- */
.sgrab{position:absolute;left:50%;top:calc(4px + env(safe-area-inset-top));width:46px;height:5px;margin-left:-23px;border-radius:9px;background:rgba(255,255,255,.3)}
.stage{position:fixed;inset:0;z-index:18;display:flex;flex-direction:column;
  background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20width%3D%27180%27%20height%3D%27180%27%3E%3Cfilter%20id%3D%27n%27%3E%3CfeTurbulence%20type%3D%27fractalNoise%27%20baseFrequency%3D%27.85%27%20numOctaves%3D%273%27%20stitchTiles%3D%27stitch%27/%3E%3CfeColorMatrix%20values%3D%270%200%200%200%200%20%200%200%200%200%200%20%200%200%200%200%200%20%200%200%200%20.55%200%27/%3E%3C/filter%3E%3Crect%20width%3D%27100%25%27%20height%3D%27100%25%27%20filter%3D%27url%28%23n%29%27/%3E%3C/svg%3E"),radial-gradient(120% 70% at 50% 30%,var(--felt1),var(--felt2) 78%);background-size:180px 180px,auto;background-blend-mode:soft-light,normal;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));animation:fade .25s}
.stage .in{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.stage .head{display:flex;align-items:center;gap:10px;min-height:52px}
.stage .head .bar{height:8px}
.stage .mid{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:0;overflow:hidden;padding:4px 0}
.stage .mid.scroll{overflow:auto}
.stage .who{font-size:34px;margin:4px 0}
.stage .who .av{width:52px;height:52px;font-size:23px}
.stage .q{font-size:18px;font-weight:700;margin:16px 0 0}
.stage .acts{display:grid;gap:10px}
.backs{display:flex;gap:8px;justify-content:center;margin:20px 0}
.pyrbtn{flex:none;margin-left:auto;display:flex;align-items:center;gap:6px;height:52px;padding:0 18px 0 12px;border-radius:18px;color:#fff;font-weight:800;font-size:17px;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.1));border:1px solid rgba(255,255,255,.5);
  -webkit-backdrop-filter:blur(14px) saturate(160%);backdrop-filter:blur(14px) saturate(160%);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.6),0 8px 22px rgba(0,0,0,.28)}
.pyrbtn:active{transform:scale(.96)}
.pyrbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:440px){.stage .head .bar{display:none}.pyrbtn{font-size:16px;padding:0 14px 0 9px}}
@media (max-width:360px){.stage .head:has(.pyrbtn) .kicker{display:none}.pyrbtn{margin:0 auto;font-size:15.5px}}
.backlink{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:10px 16px;border-radius:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);font-weight:700;color:var(--mute);font-size:15px}
.bigwrap{--W:min(76vw,calc((var(--vh,100vh) - 290px) / 1.4),var(--bigmax));width:var(--W);aspect-ratio:5/7;perspective:1400px;position:relative;margin:6px 0 14px;flex:none}
.bf{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.35,.5,1)}
.bf.shown{transform:rotateY(180deg)}
.bfs{position:absolute;inset:0;border-radius:calc(var(--W) * .06);-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.bfs.cardback{box-shadow:inset 0 0 0 calc(var(--W) * .035) #fffdf6,inset 0 0 0 calc(var(--W) * .045) rgba(0,0,0,.25),0 24px 60px rgba(0,0,0,.55)}
.bfront{transform:rotateY(180deg);box-shadow:0 24px 60px rgba(0,0,0,.55),0 0 0 4px var(--gold)}
.bfront .pc{--w:var(--W);box-shadow:none;border-radius:0}
.after{transition:opacity .3s,transform .3s}
.after.wait{opacity:0;transform:translateY(12px)}
.zoomer{position:fixed;z-index:19;aspect-ratio:5/7;transform-origin:0 0;perspective:1400px;pointer-events:none}
.zoomer.fly{transition:transform .5s cubic-bezier(.2,.85,.25,1)}
.zoomer .bf{transition:transform .45s cubic-bezier(.3,1.2,.5,1)}

#toast{position:fixed;left:50%;bottom:calc(118px + env(safe-area-inset-bottom));transform:translate(-50%,30px);opacity:0;z-index:40;
  background:#fffdf6;color:#1c1c1c;font-weight:700;padding:11px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:.3s;pointer-events:none;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:440px){body.classic #gTitle{display:none}}
/* =====================================================================
   SOIRÉE EN VERRE — thèmes Absinthe (vert), Lagon (bleu), Spritz (rouge)
   Fond nuit + lumières de bar qui dérivent + bulles qui montent,
   surfaces en verre dépoli par-dessus. Le thème Noël n'est pas concerné.
   ===================================================================== */
#amb,#fizz{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
body[data-felt="casino"] #amb,body[data-felt="casino"] #fizz,body[data-felt="xmas"] #fizz{display:none}
#amb i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
#amb i:nth-child(1){left:-34vmax;top:-30vmax;opacity:.6;background:radial-gradient(circle,var(--o1) 0,transparent 64%);animation:drift1 24s ease-in-out infinite alternate}
#amb i:nth-child(2){right:-42vmax;top:18vh;opacity:.38;background:radial-gradient(circle,var(--o2) 0,transparent 64%);animation:drift2 30s ease-in-out infinite alternate}
#amb i:nth-child(3){left:-12vmax;bottom:-50vmax;opacity:.42;background:radial-gradient(circle,var(--o3) 0,transparent 64%);animation:drift3 21s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(22vw,16vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-26vw,-14vh) scale(.9)}}
@keyframes drift3{to{transform:translate(18vw,-12vh) scale(1.08)}}
#fizz i{position:absolute;bottom:-16px;width:var(--s);height:var(--s);border-radius:50%;
  background:radial-gradient(circle at 32% 30%,rgba(255,255,255,.9) 0 16%,rgba(255,255,255,.12) 42%,rgba(255,255,255,.05) 70%);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.4);animation:rise linear infinite}
@keyframes rise{0%{transform:translate(0,0)}50%{transform:translate(var(--dx),-55vh)}100%{transform:translate(0,-112vh)}}
@media (prefers-reduced-motion:reduce){#amb i{animation:none}#fizz{display:none}}

body:not([data-felt="casino"]){background-color:var(--bg0)}
body:not([data-felt="casino"]):after{display:none}
body:not([data-felt="casino"]):before{background:radial-gradient(ellipse 120% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.6));z-index:1}
body:not([data-felt="casino"]) .wrap{z-index:2}

/* --- Verre : panneaux --- */
body:not([data-felt="casino"]) .panel{border-radius:26px;padding:18px;
  background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.035) 60%),var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(170%);backdrop-filter:blur(24px) saturate(170%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 24px 50px rgba(0,0,0,.35)}
body:not([data-felt="casino"]) .panel h2{font-size:21px}
body:not([data-felt="casino"]) .pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);color:#fff}

/* --- Éléments internes : verre léger, sans flou (plus fluide sur téléphone) --- */
body:not([data-felt="casino"]) :is(.pchip,.mode,.segb,.pbtn,.hrow,.mchip,.power,.rules li,.deckopt,.backlink,.sx){
  background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,.04));border-color:rgba(255,255,255,.13);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
body:not([data-felt="casino"]) .mode{border-width:1.5px;border-radius:20px}
body:not([data-felt="casino"]) .mode.sel,body:not([data-felt="casino"]) .deckopt.on{
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 26%,transparent),color-mix(in srgb,var(--gold) 8%,transparent));
  border-color:color-mix(in srgb,var(--gold) 75%,#fff);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 22px color-mix(in srgb,var(--gold) 22%,transparent)}
body:not([data-felt="casino"]) .mode .mico{filter:drop-shadow(0 0 8px color-mix(in srgb,var(--gold) 50%,transparent))}
body:not([data-felt="casino"]) .segb.on{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--gold) 30%,#fff));color:var(--onacc);border-color:#fff;
  box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--gold) 40%,transparent),0 6px 18px color-mix(in srgb,var(--gold) 30%,transparent)}
body:not([data-felt="casino"]) .hrow.hit{background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 22%,transparent),color-mix(in srgb,var(--gold) 6%,transparent));border-color:var(--gold)}
body:not([data-felt="casino"]) input{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.12);border-radius:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.3)}
body:not([data-felt="casino"]) input:focus{outline:none;border-color:var(--gold);box-shadow:inset 0 2px 6px rgba(0,0,0,.3),0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent)}
body:not([data-felt="casino"]) .pchip{padding:5px 6px 5px 5px}
body:not([data-felt="casino"]) .pchip>button:last-child{background:rgba(255,255,255,.08)}

/* --- Bouton principal : verre éclairé par la couleur du thème --- */
body:not([data-felt="casino"]) .btn.gold{
  background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 55%,rgba(255,255,255,.35)),color-mix(in srgb,var(--gold2) 45%,transparent) 60%,color-mix(in srgb,var(--gold2) 60%,transparent));
  border:1px solid color-mix(in srgb,var(--gold) 70%,#fff);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -6px 14px color-mix(in srgb,var(--gold2) 40%,transparent),0 10px 30px color-mix(in srgb,var(--gold2) 38%,transparent),0 2px 6px rgba(0,0,0,.3)}
body:not([data-felt="casino"]) .btn.gold:not(:disabled):active{filter:brightness(1.15)}
body:not([data-felt="casino"]) .btn.gold:disabled{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);box-shadow:none;text-shadow:none}
body:not([data-felt="casino"]) .btn.lg{border-radius:22px}
body:not([data-felt="casino"]) .gear{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 6px 16px rgba(0,0,0,.3)}

/* --- Enseigne de l'accueil : lettres crème, tranche et halo de la couleur du thème --- */
body:not([data-felt="casino"]) .hero h1{color:#fff8ec;
  text-shadow:0 1px 0 color-mix(in srgb,var(--gold) 70%,#000),0 3px 0 color-mix(in srgb,var(--gold2) 55%,#000),0 0 28px color-mix(in srgb,var(--gold) 55%,transparent),0 10px 26px rgba(0,0,0,.55)}
body:not([data-felt="casino"]) .sign .la{color:var(--gold);text-shadow:0 0 12px color-mix(in srgb,var(--gold) 60%,transparent)}
body:not([data-felt="casino"]) .sign .sub:before,body:not([data-felt="casino"]) .sign .sub:after{background:linear-gradient(90deg,transparent,var(--gold))}
body:not([data-felt="casino"]) .sign .sub:after{background:linear-gradient(90deg,var(--gold),transparent)}
body:not([data-felt="casino"]) .prev{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 1px 0 rgba(255,255,255,.3),0 12px 30px rgba(0,0,0,.35);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* --- Le plateau : une plaque de verre posée sur le bar, éclairée par en dessous --- */
body:not([data-felt="casino"]) .table{border:1px solid rgba(255,255,255,.18);border-radius:32px;background-clip:border-box;
  background:linear-gradient(170deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 45%,rgba(255,255,255,.06));
  -webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.3),inset 0 0 0 6px rgba(255,255,255,.025),inset 0 -24px 40px color-mix(in srgb,var(--gold) 7%,transparent),
    0 30px 60px rgba(0,0,0,.45),0 18px 50px -20px color-mix(in srgb,var(--gold2) 45%,transparent)}
body:not([data-felt="casino"]) .lab{background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.22);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
body:not([data-felt="casino"]) .prow.active .lab{background:radial-gradient(circle at 40% 30%,#fff,var(--gold) 55%,var(--gold2));border-color:#fff;color:var(--onacc);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 30%,transparent),0 0 18px color-mix(in srgb,var(--gold) 70%,transparent)}

/* --- Jauge de progression : un verre qui se remplit --- */

function flyReveal(sel,card,prepare,done){
  closeModal();closeStage();window.scrollTo(0,0);
  const slot=document.querySelector(sel);
  if(!slot){prepare();done();return}
  document.querySelectorAll('.slot.next').forEach(e=>e.classList.remove('next'));
  slot.classList.add('shake');sfx.drum();vib([15,110,15,90,15,70,15,40,20]);
  setTimeout(()=>{
    const from=slot.getBoundingClientRect();
    prepare();
    const st=$('#stage .stage'),bw=$('#bigwrap');
    if(!st||!bw){slot.classList.remove('shake');done();return}
    st.style.opacity='0';st.style.animation='none';
    const to=bw.getBoundingClientRect();bw.style.visibility='hidden';
    const z=document.createElement('div');z.className='zoomer';
    z.style.cssText=`left:${to.left}px;top:${to.top}px;width:${to.width}px;--W:${to.width}px;transform:translate(${from.left-to.left}px,${from.top-to.top}px) scale(${from.width/to.width})`;
    z.innerHTML=`<div class="bf" id="zbf"><div class="bfs cardback"></div><div class="bfs bfront">${face(card)}</div></div>`;
    document.body.appendChild(z);
    slot.classList.remove('shake');slot.style.visibility='hidden';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      z.classList.add('fly');z.style.transform='none';
      st.style.transition='opacity .35s';st.style.opacity='1';
      setTimeout(()=>{const b=$('#zbf');if(b)b.classList.add('shown');vib(45);sfx.flip()},120);
    }));
    setTimeout(()=>{
      bw.style.visibility='';z.remove();slot.style.visibility='';

    },650);
  },780);
}

/* En thème Noël, la pyramide devient un sapin : silhouette, étoile, tronc, guirlandes et boules.
   Dessiné d'après la position réelle des cartes, redessiné si l'écran change. */
function decorTree(){
  const P=$('#board .pyr');if(!P)return;
  P.querySelectorAll('.xdeco').forEach(e=>e.remove());const on=document.body.dataset.felt==='xmas';
  P.classList.toggle('xtree',on);if(!on)return;
  const rows=[...P.querySelectorAll('.prow')];if(!rows.length)return;
  const B=rows.map(r=>{const s=[...r.querySelectorAll('.slot')],a=s[0],b=s[s.length-1];return {l:r.offsetLeft+a.offsetLeft,r:r.offsetLeft+b.offsetLeft+b.offsetWidth,t:r.offsetTop+a.offsetTop,b:r.offsetTop+a.offsetTop+a.offsetHeight}});
  const W=P.offsetWidth,H=P.offsetHeight,top=B[0],bot=B[B.length-1],cw=top.r-top.l,cx=(top.l+top.r)/2;
  const apex=top.t-cw*.62,base=bot.b+cw*.16,half=(bot.r-bot.l)/2+cw*.42,hw=y=>half*Math.max(0,(y-apex)/(base-apex));
  const f=v=>v.toFixed(1),n=Math.max(3,Math.min(5,Math.round(rows.length*.7)));
  let tiers='';
  for(let k=n-1;k>=0;k--){const y0=apex+(base-apex)*(k?k/n-.08:0),y1=apex+(base-apex)*(k+1)/n,w=hw(y1)*(k===n-1?1:1.06),tw=k?hw(y0)*.42:0;
    tiers+=`<path d="M${f(cx-tw)} ${f(y0)}L${f(cx-w)} ${f(y1)}Q${f(cx)} ${f(y1+cw*.22)} ${f(cx+w)} ${f(y1)}L${f(cx+tw)} ${f(y0)}Z" fill="url(#xtg)"/>`+
      `<path d="M${f(cx-w)} ${f(y1)}Q${f(cx)} ${f(y1+cw*.22)} ${f(cx+w)} ${f(y1)}" class="xsnow"/>`}
  const trunk=`<rect x="${f(cx-cw*.32)}" y="${f(base-cw*.05)}" width="${f(cw*.64)}" height="${f(cw*.42)}" rx="${f(cw*.06)}" fill="url(#xtt)"/>`;
  const C=['#ffd27a','#ff4d5e','#8dffb0','#fff1c9','#ffb444','#7fc8ff'];let lights='',balls='',k=0;
  for(let i=0;i<rows.length-1;i++){
    const y=(B[i].b+B[i+1].t)/2,dir=i%2?1:-1,w=hw(y)*.98,y1=y+dir*cw*.08,y2=y-dir*cw*.08;
    lights+=`<path d="M${f(cx-w)} ${f(y1)}Q${f(cx)} ${f(y+cw*.12)} ${f(cx+w)} ${f(y2)}" class="xwire"/>`;
    const m=Math.max(3,Math.round(w*2/(cw*.55)));
    for(let j=1;j<m;j++){const t=j/m,x=(1-t)*(1-t)*(cx-w)+2*(1-t)*t*cx+t*t*(cx+w),yy=(1-t)*(1-t)*y1+2*(1-t)*t*(y+cw*.12)+t*t*y2;
      lights+=`<circle cx="${f(x)}" cy="${f(yy)}" r="${f(Math.max(2.2,cw*.07))}" fill="${C[k%C.length]}" class="xbulb" style="animation-delay:-${(k*.41%2.6).toFixed(2)}s"/>`;k++}
  }
  const BC=['#d1203f','#ffd27a','#3fa7ff','#e24ad1'];
  B.forEach((b,i)=>{if(!i)return;const yy=(b.t+b.b)/2+cw*.15,w=hw(yy);if(w-(b.r-b.l)/2<cw*.18)return;
    [-1,1].forEach((s,q)=>{const x=cx+s*((b.r-b.l)/2+(w-(b.r-b.l)/2)*.5);balls+=`<circle cx="${f(x)}" cy="${f(yy)}" r="${f(cw*.12)}" fill="url(#xb${(i+q)%4})"/>`})});
  const R=cw*.36,sy=apex-R*.15;let st='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?R*.45:R;st+=`${i?'L':'M'}${f(cx+rr*Math.cos(a))} ${f(sy+rr*Math.sin(a))}`}
  const defs=`<defs><linearGradient id="xtg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f8f52"/><stop offset="1" stop-color="#0f4a2b"/></linearGradient>
    <linearGradient id="xtt" x1="0" x2="1"><stop offset="0" stop-color="#5a3519"/><stop offset=".5" stop-color="#8a5a2e"/><stop offset="1" stop-color="#4a2a12"/></linearGradient>
    ${BC.map((c,i)=>`<radialGradient id="xb${i}" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".25" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".75"/></radialGradient>`).join('')}
    <filter id="xglow" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`;
  const back=`<svg class="xdeco" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true">${defs}${trunk}${tiers}${balls}</svg>`;
  const front=`<svg class="xdeco xfront" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><g filter="url(#xglow)">${lights}</g><path d="${st}Z" class="xstar"/></svg>`;
  P.insertAdjacentHTML('afterbegin',back);P.insertAdjacentHTML('beforeend',front);
}

  <div class="hand">${m.length?m.map(h=>face(h,'lg hl pop')).join(''):`<div class="nocard">Aucun ${rn(c.r)}</div>`}</div>
  ${m.length?`<div class="verdict ok">${G} disait vrai !<small>Celui qui a accusé boit ${n} gorgées</small></div>`
            :`<div class="verdict bad">Bluff démasqué !<small>${G} boit ${n} gorgées</small></div>`}
  <div class="row2"><button class="btn lg" onclick="closeModal();render()">OK</button>${flipped<TOTAL?`<button class="btn gold lg" onclick="cFlip()">${SUMMIT&&flipped===TOTAL-1?'Annonces':'Suivante →'}</button>`:''}</div></div>`);

/* Mains : maintenir appuyé pour voir */
const holdBox=i=>`<div class="hold" id="hold" style="--hr:${Math.ceil(hands[i].length/2)}"><div class="grid4 cover">${hands[i].map(()=>backCard('lg')).join('')}</div><div class="grid4 reveal">${hands[i].map(h=>face(h,'lg')).join('')}</div><div class="holdtxt">Garde le doigt appuyé pour voir tes cartes</div></div>`;
const PEEK_MS=2000,PEEK_COOLDOWN=120000;
let peekBlock={};
function bindHold(limit=0,onFirst=null){
  const h=$('#hold');if(!h)return;
  let used=0,t0=0,timer=null,first=true;
  const bar=h.querySelector('.hbar i');
  const expire=()=>{h.classList.remove('show');h.classList.add('expired');clearTimeout(timer);
    const t=h.querySelector('.holdtxt');if(t)t.textContent='Temps écoulé · prochain coup d\'œil dans 2 minutes';vib([30,40,30]);sfx.bad()};
  const stop=()=>{
    if(!h.classList.contains('show'))return;h.classList.remove('show');
    if(limit){used+=Date.now()-t0;clearTimeout(timer);
      if(bar){const left=Math.max(0,1-used/limit);bar.style.transition='none';bar.style.width=left*100+'%'}
      if(used>=limit)expire()}
  };
  h.addEventListener('pointerdown',e=>{
    e.preventDefault();if(h.classList.contains('expired'))return;
    h.classList.add('show');vib(10);if(first){first=false;if(onFirst)onFirst()}
    if(limit){t0=Date.now();const rest=limit-used;
      if(bar){bar.style.transition=`width ${rest}ms linear`;bar.style.width='0%'}
      timer=setTimeout(()=>{used=limit;expire()},rest)}
  });
  ['pointerup','pointercancel','pointerleave'].forEach(t=>h.addEventListener(t,stop));
  h.addEventListener('contextmenu',e=>e.preventDefault());
}
function memo(i){
  if(i>=names.length){closeModal();toast('À vous de jouer !');return}
  modal(`<div class="center"><div class="kicker">Mémorisation · ${i+1}/${names.length}</div>
  <div class="who">${av(i)} ${esc(names[i])}</div>
  <p class="hint" style="margin:2px 0 0">Retiens tes ${HAND} cartes${S.classic.peek?'':', tu ne pourras plus les revoir'}${SUMMIT?' : il faudra les annoncer à la fin':''}.</p>
  ${holdBox(i)}</div>
  <div class="sfoot"><button class="btn gold block lg" onclick="memo(${i+1})">${i+1<names.length?`Passer à ${esc(names[i+1])} →`:'C\'est parti !'}</button>
  <button class="link" style="margin-top:4px" onclick="closeModal()">Passer cette étape</button></div>`);
  bindHold();
}
function peekCost(){
  const r=flipped?rowOf(flipped-1):0;
  return isSummitRow(r)?'un cul sec':plural(rowSips(r));
}
const mmss=ms=>{const t=Math.ceil(ms/1000);return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`};
let peekTick=null;
function myCards(){
  if(!S.classic.peek)return;
  modal(`<div class="center"><h2>Qui veut voir ses cartes ?</h2><div class="cost">Un coup d'œil coûte ${peekCost()} · 2 secondes, puis 2 minutes d'attente</div></div>
  <div class="pgrid" id="peekList">${names.map((nm,i)=>`<button class="pbtn" data-i="${i}" onclick="showHand(${i})">${av(i)}<span>${esc(nm)}</span><b class="wait"></b></button>`).join('')}</div>`);
  const upd=()=>{const L=$('#peekList');if(!L){clearInterval(peekTick);return}
    L.querySelectorAll('.pbtn').forEach(b=>{const left=(peekBlock[b.dataset.i]||0)-Date.now();b.disabled=left>0;b.classList.toggle('done',left>0);b.querySelector('.wait').textContent=left>0?mmss(left):''})};
  clearInterval(peekTick);upd();peekTick=setInterval(upd,1000);
}
function showHand(i){
  const left=(peekBlock[i]||0)-Date.now();
  if(left>0){toast(`${names[i]} pourra revoir ses cartes dans ${mmss(left)}`);return}
  sfx.glug();
  modal(`<div class="center"><div class="who">${av(i)} ${esc(names[i])}</div>
  <div class="cost">${esc(names[i])} boit ${peekCost()} pour ce coup d'œil · 2 secondes max</div>
  ${holdBox(i).replace('<div class="holdtxt">','<div class="hbar"><i></i></div><div class="holdtxt">')}</div>
  <div class="sfoot"><button class="btn block lg" onclick="closeModal()">J'ai vu, fermer</button></div>`);
  bindHold(PEEK_MS,()=>{peekBlock[i]=Date.now()+PEEK_COOLDOWN});
}

/* Annonces avant le sommet */
function startAnnounce(){if(valI>=names.length){validated=true;cFlip();return}annStep(false)}
function annHead(){
  return sHead(`Annonces · ${valI+1}/${names.length}`,valI/names.length*100,`<button class="pyrbtn" onclick="closeStage();render()" style="font-size:16px;padding:0 14px">Pause</button>`);
}
function annStep(rev){
  if(valI>=names.length){
    validated=true;closeStage();

      <div class="backs">${hands[i].map(()=>backCard('sm')).join('')}</div>
      ${i>0?`<button class="backlink" onclick="annBack()">↶ Corriger ${esc(names[i-1])}</button>`:''}</div>
    <div class="acts"><button class="btn gold block lg" onclick="judgeLock=Date.now()+900;annStep(true)">J'ai annoncé · révéler mes cartes</button></div>`);

  const gr=Math.ceil(HAND/2);

    <div class="q">Les cartes annoncées étaient-elles bonnes ?</div></div>
  <div class="acts row2"><button class="btn red lg" onclick="annJudge(false)">Non · cul sec</button><button class="btn green lg" onclick="annJudge(true)">Oui, tout bon</button></div>`);
}
function annBack(){if(valI<=0)return;valI--;annErr=annErr.filter(x=>x!==valI);toast(`Retour à ${names[valI]}`);annStep(true)}
function annJudge(ok){
  if(Date.now()<judgeLock)return;judgeLock=Date.now()+700;
  const i=valI;
  if(!ok){annErr.push(i);vib([40,60,40]);sfx.bad();toast(`Cul sec pour ${names[i]}`)}
  else{sfx.good();toast(`${names[i]} a bien annoncé`)}
  valI++;annStep(false);
}
function showSummit(fromFly=false){
  const c=pyr[TOTAL-1];
  summitHit=names.map((_,i)=>i).filter(i=>hands[i].some(h=>h.r===c.r));
  stage(`${sHead('Le sommet',100,pyrBtn('Revenir à la pyramide'))}
  <div class="mid"><h2 style="font-size:28px">Le sommet</h2>
    ${bigCard(c,'--W:min(62vw,calc((var(--vh,100vh) - 430px) / 1.4),var(--bigmax))')}
    <div class="after${fromFly?' wait':''}" style="width:100%">${summitHit.length?`<div class="verdict bad" style="width:100%">${esc(list(summitHit.map(i=>names[i])))}<small>${summitHit.length>1?'ont':'a'} un ${rn(c.r)} : cul sec !</small></div>`
      :`<div class="verdict ok" style="width:100%">Personne n'a de ${rn(c.r)}<small>Tout le monde est sauvé</small></div>`}
    ${annErr.length?`<p class="hint">Déjà cul sec pour erreur d'annonce : ${esc(list(annErr.map(i=>names[i])))}</p>`:''}</div></div>
  <div class="acts">${endDock()}</div>`,true);
}

/* ================= MODE INTER-EXTER ================= */
let IE={};
const QS=[
  {t:'Rouge ou noir ?',short:'Couleur'},
  {t:'Plus ou moins ?',short:'+ / −'},
  {t:'Inter ou exter ?',short:'In / Ex'},
  {t:'Quel signe ?',short:'Signe'}
];
function startIE(){
  const c=S.ie;
  IE={cols:c.cols,mult:c.dbl?2:1,cs:c.culsec,hands:names.map(()=>[]),qi:0,qr:0,answered:false,res:null,fresh:false,ph:'quiz',k:0,dealt:false};
  const d=deck(Math.ceil((names.length*4+c.cols*2)/52));
  IE.board=d.splice(0,c.cols*2);IE.deck=d;
}
const val=c=>c.r==='A'?14:({V:11,D:12,R:13}[c.r]||+c.r);
const ieSip=c=>(c+1)*IE.mult;
const ieCS=c=>IE.cs&&c===IE.cols-1;
function renderIE(){
  if(IE.ph==='quiz')renderQuiz();else renderIEBoard();
}
/* Phase 1 : les 4 questions */
const QHINT=[
  ()=>'Devine si ta carte sera rouge ou noire.',
  h=>`Plus fort ou plus faible que ton <b>${rn(h[0].r)}</b> ? Égalité = perdu.`,
  h=>{const a=[h[0],h[1]].sort((x,y)=>val(x)-val(y));return `Entre <b>${rn(a[0].r)}</b> et <b>${rn(a[1].r)}</b> (inter), ou en dehors (exter) ? Égalité = perdu.`},
  ()=>'Trèfle, pique, carreau ou cœur ?'
];
function nextInfo(){
  const N=names.length,last=IE.qi+1>=N;
  if(last&&IE.qr>=3)return {lbl:'🃏 Au plateau !',who:null};
  if(last)return {lbl:`Question ${IE.qr+2} · ${esc(names[0])} →`,who:0};
  return {lbl:`Au tour de ${esc(names[IE.qi+1])} →`,who:IE.qi+1};
}
function renderQuiz(){
  const i=IE.qi,h=IE.hands[i],N=names.length,q=IE.qr,done=IE.answered;
  $('#stat').textContent=`Question ${q+1}/4 · joueur ${i+1}/${N}`;
  $('#prog').style.width=((q*N+i+(done?1:0))/(N*4)*100)+'%';
  let cards='';
  for(let j=0;j<4;j++){
    if(j<h.length){const fresh=IE.fresh&&j===h.length-1;
      cards+=`<div class="slot nodeal${fresh?'':' on'}"${fresh?' id="freshSlot"':''}><div class="flip"><div class="side back cardback"></div><div class="side front">${face(h[j])}</div></div></div>`;}
    else cards+=`<div class="slot nodeal${j===h.length?' next':''}"><div class="flip"><div class="side back cardback"></div></div></div>`;
  }
  $('#board').innerHTML=`<div class="quiz"><div class="kicker">${done?'Résultat de':'Au tour de'}</div><div class="who">${av(i)} ${esc(names[i])}</div>
    <div class="qcards">${cards}</div><div class="qcards qlabels" style="margin-top:8px">${QS.map((x,j)=>`<span class="${j===q?'on':''}">${x.short}</span>`).join('')}</div></div>`;
  if(IE.fresh){IE.fresh=false;requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('#freshSlot');if(f)f.classList.add('on')}))}
  let html='';
  if(done&&IE.res){
    const nx=nextInfo();
    html+=`<div class="verdict ${IE.res.ok?'ok':'bad'}${IE.res.wait?' wait':''}" id="qres">${IE.res.ok?'Bien vu':'Raté'}<small>${esc(names[i])} ${IE.res.ok?'donne':'boit'} ${plural(IE.res.n)}</small></div>
    <p class="hint center" style="margin-bottom:0">${nx.who===null?'Tout le monde a ses 4 cartes : place au plateau !':nx.who===0?`Tour de table terminé ! Question suivante : <b>${QS[q+1].t}</b>`:`Passe le téléphone à <b>${esc(names[nx.who])}</b>.`}</p>`;
  }else{
    html+=`<div class="kicker">Question ${q+1}/4 · ${plural((q+1)*IE.mult)} en jeu</div><div class="big">${QS[q].t}</div>
    <p class="hint" style="margin-bottom:0">${QHINT[q](h)} Bonne réponse : tu donnes. Mauvaise : tu bois.</p>`;
  }
  $('#action').innerHTML=html;
  $('#extra').innerHTML='';
  const D=$('#dockIn');
  if(done){D.innerHTML=`<button class="btn gold block lg" onclick="nextPlayer()">${nextInfo().lbl}</button>`;return}
  if(q===0)D.innerHTML=`<div class="row2"><button class="btn red lg" onclick="answer('red')">Rouge</button><button class="btn lg blackbtn" onclick="answer('black')">Noir</button></div>`;
  else if(q===1)D.innerHTML=`<div class="row2"><button class="btn gold lg" onclick="answer('plus')">${ic('up')}Plus</button><button class="btn gold lg" onclick="answer('moins')">${ic('down')}Moins</button></div>`;
  else if(q===2)D.innerHTML=`<div class="row2"><button class="btn gold lg" onclick="answer('inter')">${ic('inter')}Inter</button><button class="btn gold lg" onclick="answer('exter')">${ic('exter')}Exter</button></div>`;
  else D.innerHTML=`<div class="qgrid4">${[['♣','Trèfle'],['♠','Pique'],['♦','Carreau'],['♥','Cœur']].map(([s2,t])=>`<button class="btn${s2==='♦'||s2==='♥'?' rs':''}" onclick="answer('${s2}')"><span class="s">${s2}</span>${t}</button>`).join('')}</div>`;
}
function answer(v){
  if(locked()||IE.answered)return;lock(850);
  const h=IE.hands[IE.qi],j=h.length;if(j!==IE.qr)return;
  const c=IE.deck.pop();let ok;
  if(j===0)ok=(v==='red')===isRed(c);
  else if(j===1){const a=val(c),b=val(h[0]);ok=v==='plus'?a>b:a<b}
  else if(j===2){const a=val(c),x=val(h[0]),y=val(h[1]),lo=Math.min(x,y),hi=Math.max(x,y);ok=v==='inter'?(a>lo&&a<hi):(a<lo||a>hi)}
  else ok=v===c.s;
  h.push(c);IE.res={ok,n:(j+1)*IE.mult,wait:true};addSt(IE.qi,ok?'don':'bu',(j+1)*IE.mult);IE.fresh=true;IE.answered=true;
  renderQuiz();sfx.flip();vib(20);
  setTimeout(()=>{if(!IE.res)return;IE.res.wait=false;const r=$('#qres');if(r){r.classList.remove('wait');r.style.animation='none';void r.offsetWidth;r.style.animation=''}ok?sfx.good():sfx.bad();vib(ok?30:[40,60,40])},600);
}
function nextPlayer(){
  if(locked()||!IE.answered)return;lock(500);
  IE.answered=false;IE.res=null;IE.qi++;
  if(IE.qi>=names.length){
    IE.qi=0;IE.qr++;
    if(IE.qr>=4){IE.ph='board';toast('Place au plateau !')}
    else toast(`Question ${IE.qr+1} : ${QS[IE.qr].t}`);
  }
  sfx.tap();renderIE();window.scrollTo(0,0);
}
/* Phase 2 : le plateau (donne / bois) */
function matches(c){return names.map((_,i)=>({i,n:IE.hands[i].filter(h=>h.r===c.r).length})).filter(x=>x.n)}
function ieAmount(col,n){return ieCS(col)?(n>1?`${n} culs secs`:'un cul sec'):plural(ieSip(col)*n)}
function ieSlot(k){
  const cls=['slot',IE.dealt?'nodeal':'',k<IE.k?'on':'',k===IE.k-1?'cur':'',k===IE.k?'next':''].join(' ');
  return `<div class="${cls}" data-k="${k}" style="--d:${k*40}ms" onclick="if(${k}===IE.k)ieNext()"><div class="flip"><div class="side back cardback"></div><div class="side front">${face(IE.board[k])}</div></div></div>`;
}
function renderIEBoard(){
  const C=IE.cols,T=C*2,k=IE.k;
  $('#stat').textContent=k===0?`Plateau · ${T} cartes`:k>=T?'Partie terminée':`${(k-1)%2===0?'Donne':'Bois'} · ${k}/${T}`;
  $('#prog').style.width=(k/T*100)+'%';
  const curCol=k?((k-1)>>1):-1;
  let head='<span class="rowlab"></span>',g='',d='';
  for(let c=0;c<C;c++){head+=`<span class="colsip${c===curCol?' on':''}">${ieCS(c)?ic('glass'):ieSip(c)}</span>`;g+=ieSlot(2*c);d+=ieSlot(2*c+1)}
  $('#board').innerHTML=`<div class="ieboard" style="--cols:${C}"><div class="ierow">${head}</div>
    <div class="ierow"><span class="rowlab give"><b>Donne</b></span>${g}</div>
    <div class="ierow"><span class="rowlab drink"><b>Bois</b></span>${d}</div></div>`;
  IE.dealt=true;
  const cur=k?IE.board[k-1]:null;
  if(!cur){
    $('#action').style.display='none';
  }else{
    const give=(k-1)%2===0,col=(k-1)>>1,m=matches(cur);
    $('#action').innerHTML=`<div class="nowmini" onclick="showIEReveal()">${face(cur,'xs')}<div><b style="color:${give?'var(--gold)':'#ff8f99'}">${give?'On donne':'On boit'} ${ieCS(col)?'un cul sec':plural(ieSip(col))}</b>
      <div class="hint" style="margin:2px 0 0;font-size:14px">${m.length?m.map(x=>`<b>${esc(names[x.i])}</b> ${ieAmount(col,x.n)}`).join(' · '):`Personne n'a de ${rn(cur.r)}.`}</div></div></div>`;
  }
  $('#extra').innerHTML=`<div class="panel"><div class="ph"><h2>Les cartes de chacun</h2></div><div class="hands">${names.map((nm,i)=>{
    const hit=cur&&IE.hands[i].some(h=>h.r===cur.r);
    return `<div class="hrow${hit?' hit':''}">${av(i)}<span class="nm">${esc(nm)}</span><div class="hc">${IE.hands[i].map(h=>face(h,'xs'+(cur?(h.r===cur.r?' hl':' dim'):''))).join('')}</div></div>`}).join('')}</div></div>`;
  const D=$('#dockIn');
  if(k===0)D.innerHTML=`<button class="btn gold block lg" onclick="ieNext()">Retourner la première carte</button>`;
  else if(k<T)D.innerHTML=`<button class="btn gold block lg" onclick="ieNext()">Carte suivante →</button>`;
  else D.innerHTML=endDock();
}
function ieNext(){
  if(IE.ph!=='board'||locked()||IE.k>=IE.cols*2)return;
  lock(1900);
  const k=IE.k;
  flyReveal(`.slot[data-k="${k}"]`,IE.board[k],()=>{IE.k=k+1;
    {const c=IE.board[k],give=k%2===0,col=k>>1,cs=ieCS(col);matches(c).forEach(x=>{if(cs)addSt(x.i,give?'dcs':'cs',x.n);else addSt(x.i,give?'don':'bu',ieSip(col)*x.n)})}
    showIEReveal(true)},()=>{
    renderIEBoard();
    const c=IE.board[k],m=matches(c),cs=ieCS(k>>1),give=k%2===0;
    if(!m.length)sfx.tap();else if(cs)sfx.fanfare();else give?sfx.good():sfx.glug();
    if(m.length)vib([40,60,40]);
  });
}
function showIEReveal(fromFly=false){
  const k=IE.k-1;if(k<0)return;
  const T=IE.cols*2,c=IE.board[k],give=k%2===0,col=k>>1,m=matches(c),cs=ieCS(col);
  stage(`${sHead(`${give?'Donne':'Bois'} · ${IE.k}/${T}`,IE.k/T*100,pyrBtn('Plateau'))}
  <div class="mid">${bigCard(c,'--W:min(60vw,calc((var(--vh,100vh) - 450px) / 1.4),var(--bigmax))')}
    <div class="after${fromFly?' wait':''}" style="width:100%">
      <div class="big" style="font-size:34px;color:${give?'var(--gold)':'#ff8f99'}">${give?'On donne':'On boit'} ${cs?'un cul sec':plural(ieSip(col))}</div>
      ${m.length?`<div class="mlist">${m.map(x=>`<div class="mchip${give?'':' drink'}">${av(x.i)}<span>${esc(names[x.i])}</span><b>${give?'donne':'boit'} ${ieAmount(col,x.n)}</b></div>`).join('')}</div>`
        :`<p class="hint">Personne n'a de ${rn(c.r)}. Ouf !</p>`}
    </div></div>
  <div class="acts">${IE.k<T?`<button class="btn gold block lg" onclick="ieNext()">Carte suivante →</button>`:`<button class="btn gold block lg" onclick="closeStage();render()">Fin de la partie</button>`}</div>`,true);
}

/* ================= CLASSEMENT DES GORGÉES (Inter-Exter, Cheucheuille) =================
   Discret : rien ne s'affiche pendant le jeu, seulement dans la pop-up du bouton podium. */
let ST=[],rankBy='bu';
function resetStats(){ST=names.map(()=>({bu:0,cs:0,don:0,dcs:0}))}
function addSt(i,k,n=1){if(ST[i])ST[i][k]+=n}
function showRank(){
  if(!ST.length)resetStats();
  const score=s=>rankBy==='bu'?s.bu+s.cs*6:s.don+s.dcs*6;
  const rows=names.map((n,i)=>({i,n,s:ST[i]||{bu:0,cs:0,don:0,dcs:0}})).sort((a,b)=>score(b.s)-score(a.s)||a.i-b.i);
  const cell=(g,c)=>`${g}${c?`<small>+${c} cul${c>1?'s':''} sec</small>`:''}`;
  modal(`<h2>Classement</h2>
  <div class="segrow rkseg"><button class="segb${rankBy==='bu'?' on':''}" onclick="rankBy='bu';showRank()">Qui a le plus bu</button><button class="segb${rankBy==='don'?' on':''}" onclick="rankBy='don';showRank()">Qui a le plus donné</button></div>
  <div class="rk"><div class="rkh"><span></span><span>Joueur</span><span>Bu</span><span>Donné</span></div>
  ${rows.map((r,k)=>`<div class="rkr${k<3&&score(r.s)?' rktop':''}"><span class="rkn">${k+1}</span><span class="rkp">${av(r.i)}<b>${esc(r.n)}</b></span><span class="${rankBy==='bu'?'on':''}">${cell(r.s.bu,r.s.cs)}</span><span class="${rankBy==='don'?'on':''}">${cell(r.s.don,r.s.dcs)}</span></div>`).join('')}</div>

function drawOrder(){
  const L=$('#olist');if(!L)return;
  L.innerHTML=ORD.map((i,k)=>`<div class="oitem" data-k="${k}"><span class="onum">${k+1}</span>${av(i)}<b>${esc(names[i])}</b><span class="ogrip" aria-hidden="true"><i></i><i></i><i></i></span></div>`).join('');

}
function dragStart(e){
  const el=e.currentTarget,L=$('#olist'),sh=$('#sheet'),items=[...L.children],from=+el.dataset.k,hgt=el.offsetHeight+8;
  let y0=e.clientY,dy=0,to=from,sc0=sh.scrollTop,raf=null,lastY=e.clientY;
  el.setPointerCapture(e.pointerId);el.classList.add('drag');vib(10);
  const move=ev=>{lastY=ev.clientY;upd()};
  const upd=()=>{
    dy=lastY-y0+(sh.scrollTop-sc0);
    el.style.transform=`translateY(${dy}px) scale(1.03)`;
    to=Math.max(0,Math.min(items.length-1,Math.round(from+dy/hgt)));
    items.forEach((it,k)=>{if(it===el)return;let s=0;if(from<to&&k>from&&k<=to)s=-hgt;if(from>to&&k<from&&k>=to)s=hgt;it.style.transform=s?`translateY(${s}px)`:''});
  };
  const auto=()=>{const r=sh.getBoundingClientRect();if(lastY<r.top+70)sh.scrollTop-=8;else if(lastY>r.bottom-70)sh.scrollTop+=8;upd();raf=requestAnimationFrame(auto)};
  raf=requestAnimationFrame(auto);
  const end=()=>{
    cancelAnimationFrame(raf);el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',end);el.removeEventListener('pointercancel',end);
    if(to!==from){const [x]=ORD.splice(from,1);ORD.splice(to,0,x);sfx.tap();vib(8)}
    drawOrder();
  };
  el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}
function chuOrderOk(){

/* ================= MODE CHEUCHEUILLE ================= */
/* 52 cartes en cercle autour d'un verre. Chacun pioche à son tour.
   Faire un trou dans le cercle = cul sec. Le 4e Roi boit le verre du milieu. */
const CHW=18;               // largeur angulaire d'une carte (degrés) : chaque carte chevauche ses voisines
const LIQ=['#e8a33a','#c8283c','#7cc4e8','#8e5bd0'];
let CH={};
function startChu(){
  const d=deck(1);
  CH={cards:d.map((c,i)=>({c,a:i*360/52+(Math.random()*5-2.5),z:Math.floor(Math.random()*52),taken:false})),
      turn:0,kings:0,drawn:0,holders:{pouce:null,chu:null,freeze:null},over:false,dealt:false,
      liq:LIQ.slice().sort(()=>Math.random()-.5)};
}
const angDist=(a,b)=>{const d=Math.abs(((a-b)%360+360)%360);return Math.min(d,360-d)};
function gapCount(list){            // nombre de « trous » dans le cercle formé par ces cartes
  if(list.length<2)return 0;
  const s=list.map(x=>x.a).sort((x,y)=>x-y);let g=0;
  for(let i=0;i<s.length;i++){const a=s[i],b=s[(i+1)%s.length];if(angDist(a,b)>=CHW&&!(s.length===2&&i===1))g++}
  return g;
}
function chuGeom(){
  const bw=$('#board').clientWidth-8,land=innerWidth>innerHeight;
  const S=Math.max(220,Math.min(bw,innerHeight*(land?0.62:0.6),560));
  const R=S/2/1.24,cw=2*R*Math.sin(CHW/2*Math.PI/180)*1.02,ch=cw*1.4;
  return {S,R,cw,ch};
}
function glassSVG(k,big){
  const H=100,lay=[];for(let i=0;i<k;i++)lay.push(`<rect x="0" y="${120-(i+1)*22}" width="100" height="22.5" fill="${CH.liq[i]}"/>`);
  return `<svg viewBox="0 0 100 124" class="${big?'bigglass':'glass'}" aria-hidden="true"><defs><clipPath id="gc${big?'b':''}"><path d="M14 8 H86 L78 116 Q77 120 72 120 H28 Q23 120 22 116 Z"/></clipPath></defs>
  <g clip-path="url(#gc${big?'b':''})">${lay.join('')}${k?`<rect x="0" y="${120-k*22-2}" width="100" height="4" fill="rgba(255,255,255,.35)"/>`:''}</g>
  <path d="M14 8 H86 L78 116 Q77 120 72 120 H28 Q23 120 22 116 Z" fill="rgba(255,255,255,.1)" stroke="rgba(255,255,255,.85)" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="50" cy="8" rx="36" ry="4" fill="none" stroke="rgba(255,255,255,.9)" stroke-width="2.5"/>
  <path d="M24 20 L30 104" stroke="#fff" stroke-width="4" opacity=".35" stroke-linecap="round"/>
  ${[1,2,3].map(i=>`<path d="M${80-i*1.6} ${120-i*22} h-6" stroke="rgba(255,255,255,.6)" stroke-width="2"/>`).join('')}</svg>`;
}
function renderChu(){
  const N=names.length,left=CH.cards.filter(x=>!x.taken).length;
  $('#stat').textContent=CH.over?'Partie terminée':`Rois ${CH.kings}/4 · ${left} cartes`;
  $('#prog').style.width=(CH.kings/4*100)+'%';
  const g=chuGeom();
  const cards=CH.cards.map((x,i)=>x.taken?'':
    `<div class="cc" style="z-index:${x.z};width:${g.cw}px;height:${g.ch}px;margin:${-g.ch/2}px 0 0 ${-g.cw/2}px;transform:rotate(${x.a}deg) translateY(${-g.R}px)" onclick="chuDraw(${i})">
      <div class="slot ${CH.dealt?'nodeal':''}" data-ch="${i}" style="--cw:${g.cw}px;--d:${(i%52)*12}ms"><div class="flip"><div class="side back cardback"></div><div class="side front">${face(x.c)}</div></div></div></div>`).join('');
  $('#board').innerHTML=`<div class="chuboard" style="width:${g.S}px;height:${g.S}px">${cards}<div class="glasswrap" style="width:${g.R*0.78}px">${glassSVG(CH.kings)}<span>${CH.kings}/4</span></div></div>`;
  CH.dealt=true;
  // panneau : à qui le tour + pouvoirs
  const P=CH.holders,who=i=>i==null?'<i>personne</i>':`${av(i)}<b>${esc(names[i])}</b>`;
  $('#action').innerHTML=CH.over
    ?`<div class="center"><div class="big">Partie terminée</div><p class="hint" style="margin-bottom:0">${esc(names[CH.lastDrawer])} a bu le verre du milieu.</p></div>`
    :`<div class="turn">${av(CH.turn)}<div><div class="kicker">À toi de piocher</div><div class="big" style="font-size:26px">${esc(names[CH.turn])}</div></div></div>
      <p class="hint" style="margin:10px 0 0">Touche une carte du cercle. Attention : si tu fais un trou, c'est cul sec.</p>`;
  $('#extra').innerHTML=`<div class="panel"><div class="ph"><h2>Pouvoirs</h2><span class="hint" style="margin:0;font-size:12px">Touche pour le lancer</span></div>
    <div class="powers">
      ${pw('chu','Cheucheuille','Valet',P.chu)}${pw('freeze','Freeze','Dame',P.freeze)}${pw('pouce','Roi des pouces','10',P.pouce)}
    </div></div>`;
  function pw(k,t,card,h){return `<button class="power${h==null?' none':''}" ${h==null?'disabled':''} onclick="powerFlash('${k}')"><span class="pk">${card}</span><span class="pt">${t}</span><span class="ph2">${who(h)}</span></button>`}
  const D=$('#dockIn');
  D.innerHTML=CH.over?endDock():`<button class="btn gold block lg" onclick="chuRandom()">Piocher une carte au hasard</button>`;
}
function chuRandom(){const l=CH.cards.map((x,i)=>x.taken?-1:i).filter(i=>i>=0);if(l.length)chuDraw(l[Math.floor(Math.random()*l.length)])}
function chuDraw(i){
  if(CH.over||locked()||CH.cards[i].taken)return;
  lock(1900);
  const before=gapCount(CH.cards.filter(x=>!x.taken));
  const after=gapCount(CH.cards.filter((x,j)=>!x.taken&&j!==i));
  const hole=S.chu.hole&&after>before;
  const drawer=CH.turn,N=names.length;
  flyReveal(`.slot[data-ch="${i}"]`,CH.cards[i].c,()=>{
    CH.cards[i].taken=true;CH.drawn++;CH.lastDrawer=drawer;
    const c=CH.cards[i].c;
    if(c.r==='R'){CH.kings++;if(CH.kings>=4)CH.over=true}
    if(c.r==='V')CH.holders.chu=drawer;
    if(c.r==='D')CH.holders.freeze=drawer;
    if(c.r==='10')CH.holders.pouce=drawer;
    CH.turn=(drawer+1)%N;
    if(hole)addSt(drawer,'cs');
    if(c.r==='A')addSt(drawer,'cs');
    if(c.r==='R'&&CH.over)addSt(drawer,'cs');
    if(c.r==='6'){addSt((drawer-1+N)%N,'bu');addSt(drawer,'don')}
    if(c.r==='8'){addSt((drawer+1)%N,'bu');addSt(drawer,'don')}
    if(c.r==='7')names.forEach((_,j)=>addSt(j,'bu'));
    showChuReveal(c,drawer,hole,true);
  },()=>{
    renderChu();
    const c=CH.cards[i].c;
    if(hole||c.r==='A'||(c.r==='R'&&CH.over)){sfx.fanfare();vib([60,80,60])}
    else if(c.r==='7')sfx.glug();
    else if(['V','D','10','R','3'].includes(c.r))sfx.good();
    else if(['6','8'].includes(c.r))sfx.glug();
    else sfx.tap();
  });
}
function chuRule(c,d){
  const N=names.length,D=`<b>${esc(names[d])}</b>`,prev=`<b>${esc(names[(d-1+N)%N])}</b>`,nxt=`<b>${esc(names[(d+1)%N])}</b>`,sv=S.chu.valet,sd=S.chu.dame;
  switch(c.r){
    case 'A':return {t:'Cul sec !',k:'bad',d:`${D} boit son verre cul sec.`};
    case '3':return {t:'Dans ma valise il y a…',k:'',d:`${D} commence : « Dans ma valise il y a… » et un objet. Chacun répète toute la liste et ajoute le sien. Le premier qui se trompe boit.`};
    case '6':return {t:"Le joueur d'avant boit",k:'',d:`${prev} boit 1 gorgée.`};
    case '7':return {t:'Tournée générale',k:'bad',d:'Tout le monde boit !'};
    case '8':return {t:"Le joueur d'après boit",k:'',d:`${nxt} boit 1 gorgée.`};
    case '10':return {t:'Roi des pouces',k:'gold',d:`${D} a le pouvoir : quand il pose son pouce sur la table, tout le monde l'imite. Le dernier boit 1 gorgée.`};
    case 'V':return {t:'Cheucheuille',k:'gold',d:`${D} peut à tout moment crier « Cheucheuille ! » en se tapant la tête. Tout le monde l'imite : le dernier boit ${plural(sv)}.`};
    case 'D':return {t:'Freeze',k:'gold',d:`${D} peut à tout moment dire « Freeze ! ». Tout le monde se fige : celui qui bouge boit ${plural(sd)}.`};
    case 'R':return CH.kings>=4
      ?{t:'Le verre du milieu',k:'bad',d:`4<sup>e</sup> Roi ! ${D} boit le verre du milieu. Fin de la partie.`}
      :{t:'Le verre du milieu',k:'',d:`${D} verse ce qu'il veut dans le verre du milieu, alcool ou pas. Roi ${CH.kings}/4.`};
    default:return {t:'Rien',k:'mute',d:'Pas de règle pour cette carte. Ouf.'};
  }
}
function showChuReveal(c,d,hole,fromFly=false){
  const r=chuRule(c,d),N=names.length;
  stage(`${sHead(`${esc(names[d])} · Rois ${CH.kings}/4`,CH.kings/4*100,pyrBtn('Le cercle'))}
  <div class="mid">${bigCard(c,'--W:min(60vw,calc((var(--vh,100vh) - 450px) / 1.4),var(--bigmax))')}

function powerFlash(k){

/* ================= MIROIR SPECTATEUR =================
   L'hôte publie l'écran de la partie dans la base partagée de l'artefact (live/<CODE>).
   Les spectateurs entrent le code et voient le même écran, sans pouvoir toucher à rien. */
let LDB=null,LIVE={code:null,last:'',busy:false,pending:false,obs:null,tm:null,canWrite:true},SPEC={on:false,unsub:null,code:null,timer:null};
/* Base temps réel : Firebase si configuré (version hébergée), sinon la base de l'artefact Claude.
   Firebase est chargé en fin de page, après l'affichage du jeu : initLDB est appelé une fois ses scripts prêts. */
async function initLDB(){
  try{
    const cfg=window.FIREBASE_CONFIG;
    if(cfg&&cfg.apiKey&&!/REMPLIR/.test(cfg.apiKey)&&window.firebase){
      firebase.initializeApp(cfg);const rdb=firebase.database();
      LDB={doc:p=>({
        set:v=>rdb.ref(p).set(v),
        onSnapshot:(next,err)=>{const r=rdb.ref(p);const h=s=>next({exists:s.exists(),data:()=>s.val(),metadata:{fromCache:false}});
          r.on('value',h,e=>err&&err(e));return ()=>r.off('value',h)}
      })};
    }else if(window.claude&&claude.use){LDB=await claude.use('db')}
    if(LDB)document.body.classList.add('live-ok');
  }catch(e){LDB=null}
  // une partie lancée avant la fin du chargement récupère son code spectateur
  if(LDB&&!SPEC.on&&!LIVE.code&&!$('#game').hidden)liveStart();
}
const CODECH='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newCode=()=>Array.from({length:4},()=>CODECH[Math.floor(Math.random()*CODECH.length)]).join('');
/* -- sérialisation : on remplace chaque carte dessinée par un repère léger -- */
function serial(el){
  if(!el)return '';
  const c=el.cloneNode(true);
  c.querySelectorAll('.pc[data-c]').forEach(p=>{
    const [r,s]=p.dataset.c.split('|');
    const cls=[...p.classList].filter(k=>k!=='pc'&&k!=='red'&&!k.startsWith('d-')).join(' ');
    const b=document.createElement('b');b.dataset.pc=`${r}|${s}|${cls}`;if(p.getAttribute('style'))b.dataset.st=p.getAttribute('style');
    p.replaceWith(b);
  });
  c.querySelectorAll('#hold,.hold').forEach(h=>h.remove());   // les mains secrètes ne partent jamais
  return c.innerHTML;
}
function snapshot(){
  const m=$('#modal');const secret=m.querySelector('#hold');
  return {
    title:$('#gTitle').textContent,stat:$('#stat').textContent,prog:$('#prog').style.width,
    board:serial($('#board')),action:$('#action').style.display==='none'?'':serial($('#action')),extra:serial($('#extra')),
    stage:serial($('#stage')),modal:secret?'':serial(m),felt:S.felt,deck:S.deck,mode:MODE
  };
}
async function liveStart(){
  const keep=LIVE.code;liveStop(true);
  if(!LDB)return;
  LIVE.code=keep||newCode();LIVE.last='';LIVE.canWrite=true;
  $('#liveBtn').hidden=false;$('#liveCode').textContent=LIVE.code;
  LIVE.obs=new MutationObserver(()=>{clearTimeout(LIVE.tm);LIVE.tm=setTimeout(livePush,300)});
  ['#game','#stage','#modal'].forEach(s=>LIVE.obs.observe($(s),{childList:true,subtree:true,attributes:true,characterData:true}));
  livePush();
}
async function livePush(){
  if(!LDB||!LIVE.code||!LIVE.canWrite)return;
  if(LIVE.busy){LIVE.pending=true;return}
  const snap=JSON.stringify(snapshot());if(snap===LIVE.last)return;
  LIVE.busy=true;LIVE.last=snap;
  try{await LDB.doc('live/'+LIVE.code).set({s:snap,t:Date.now(),ended:false})}
  catch(e){const c=String((e&&(e.code||e.message))||'');if(/invalid_argument|permission/i.test(c)){LIVE.canWrite=false;$('#liveBtn').hidden=true}}
  LIVE.busy=false;if(LIVE.pending){LIVE.pending=false;livePush()}
}
function liveStop(silent){
  if(LIVE.obs)LIVE.obs.disconnect();LIVE.obs=null;clearTimeout(LIVE.tm);
  if(LDB&&LIVE.code&&LIVE.canWrite&&!silent){LDB.doc('live/'+LIVE.code).set({s:'',t:Date.now(),ended:true}).catch(()=>{})}
  LIVE.code=null;const b=$('#liveBtn');if(b)b.hidden=true;
}
function liveInfo(){
  if(!LIVE.code)return;
  modal(`<div class="center"><div class="kicker">Mode spectateur</div><div class="bigcode">${LIVE.code}</div>
  <p class="hint">Les autres ouvrent le même lien Alcolo, touchent « Regarder une partie » sur l'accueil et tapent ce code. Ils voient ton écran en direct, sans pouvoir rien toucher. Les mains secrètes de la Pyramide ne sont jamais montrées.</p>
  <button class="btn gold block lg" onclick="closeModal()">OK</button></div>`);
}
/* -- côté spectateur -- */
function joinAsk(){
  if(!LDB){modal(`<div class="center"><h2>Regarder une partie</h2><p class="hint">Le mode spectateur n'est pas encore configuré sur cette version d'Alcolo.</p><button class="btn gold block lg" onclick="closeModal()">OK</button></div>`);return}
  modal(`<div class="center"><h2>Regarder une partie</h2><p class="hint">Tape le code affiché sur le téléphone de celui qui lance la partie.</p>
  <form id="joinForm" class="addrow" style="margin:14px 0"><input id="joinCode" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" style="text-align:center;font-size:26px;letter-spacing:.3em;font-weight:800;text-transform:uppercase"><button class="btn gold" type="submit">Rejoindre</button></form>
  <p class="hint" id="joinMsg" style="min-height:20px"></p></div>`);
  setTimeout(()=>{const i=$('#joinCode');if(i)i.focus()},300);
  $('#joinForm').addEventListener('submit',e=>{e.preventDefault();const c=$('#joinCode').value.trim().toUpperCase();if(c.length===4)specStart(c)});
}
function specStart(code){
  specStop();
  SPEC={on:true,unsub:null,code,timer:null,got:false};
  const msg=$('#joinMsg');if(msg)msg.textContent='Connexion…';
  SPEC.timer=setTimeout(()=>{if(!SPEC.got){const m=$('#joinMsg');if(m)m.textContent='Aucune partie trouvée avec ce code pour le moment.'}},10000);
  try{
    SPEC.unsub=LDB.doc('live/'+code).onSnapshot(d=>{
      if(!d.exists){if(!d.metadata.fromCache){const m=$('#joinMsg');if(m)m.textContent='Aucune partie avec ce code.'}return}
      const v=d.data();SPEC.got=true;clearTimeout(SPEC.timer);
      if(v.ended){specEnded();return}
      try{specRender(JSON.parse(v.s))}catch(e){}
    },()=>{const m=$('#joinMsg');if(m)m.textContent='Impossible de rejoindre cette partie.'});
  }catch(e){const m=$('#joinMsg');if(m)m.textContent='Code invalide.'}
}
function expand(html,deck){
  const t=document.createElement('div');t.innerHTML=html||'';
  t.querySelectorAll('b[data-pc]').forEach(b=>{
    const [r,s,cls]=b.dataset.pc.split('|');const w=document.createElement('div');
    w.innerHTML=face({r,s},cls||'',deck);const p=w.firstElementChild;if(b.dataset.st)p.setAttribute('style',b.dataset.st);b.replaceWith(p);
  });
  t.querySelectorAll('script,iframe,object,embed').forEach(x=>x.remove());
  t.querySelectorAll('*').forEach(x=>[...x.attributes].forEach(a=>{if(/^on/i.test(a.name)&&!x.closest('.specbar'))x.removeAttribute(a.name)}));
  return t.innerHTML;
}
function specRender(v){
  if(!SPEC.on)return;
  document.body.classList.add('spectator','ingame');
  if(['green','blue','red','casino','xmas'].includes(v.felt)){document.body.dataset.felt=v.felt}
  const deck=['classic','elegant','modern','retro','noel'].includes(v.deck)?v.deck:'classic';document.body.dataset.deck=deck;snowFor(v.felt);
  $('#setup').hidden=true;$('#game').hidden=false;$('#dock').hidden=true;
  $('#gTitle').textContent=v.title||'';$('#stat').textContent=v.stat||'';$('#prog').style.width=v.prog||'0%';
  $('#board').innerHTML=expand(v.board,deck);requestAnimationFrame(decorTree);
  $('#action').style.display=v.action?'':'none';$('#action').innerHTML=expand(v.action,deck);
  $('#extra').innerHTML=expand(v.extra,deck);
  $('#stage').innerHTML=expand(v.stage,deck);document.body.classList.toggle('lock',!!v.stage);
  $('#modal').innerHTML=v.modal?expand(v.modal,deck):'';
  $('#specCode').textContent=SPEC.code;
}
function specEnded(){
  $('#stage').innerHTML='';$('#modal').innerHTML=`<div class="ov"><div class="sheet"><div class="center"><h2>La partie est terminée</h2><p class="hint">L'hôte a quitté la partie.</p><button class="btn gold block lg spec-ok" onclick="specStop()">Retour à l'accueil</button></div></div></div>`;
}
function specStop(){
  if(SPEC.unsub)try{SPEC.unsub()}catch(e){}
  clearTimeout(SPEC.timer);const was=SPEC.on;SPEC={on:false};
  if(was){document.body.classList.remove('spectator','lock');document.body.dataset.felt=S.felt;document.body.dataset.deck=S.deck;snowFor(S.felt);closeStage();toSetup()}
}
function snowFor(f){const k=S.felt;S.felt=f;snow();S.felt=k}
/* le spectateur ne peut rien toucher, sauf la barre spectateur */
['click','pointerdown','touchstart','submit','keydown'].forEach(t=>document.addEventListener(t,e=>{
  if(!document.body.classList.contains('spectator'))return;
  if(e.target.closest&&(e.target.closest('.specbar')||e.target.closest('.spec-ok')))return;
  if(t==='touchstart')return;   // laisser défiler
  e.stopPropagation();if(t!=='pointerdown')e.preventDefault();
},true));

/* ================= Communs ================= */
function stage(html,swipe=false){
  $('#stage').innerHTML=`<div class="stage" id="stg">${swipe?'<div class="sgrab"></div>':''}<div class="in">${html}</div></div>`;
  document.body.classList.add('lock');fitBig();if(swipe)bindStageSwipe();
}
/* la grande carte prend toute la place disponible, sans jamais pousser les boutons hors de l'écran */
function fitBig(){
  const mid=$('.stage .mid'),bw=$('#bigwrap');if(!mid||!bw)return;
  bw.style.setProperty('--W','10px');
  const max=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bigmax'))||340;
  let W;
  if(getComputedStyle(mid).flexDirection==='row'){W=Math.min((mid.clientHeight-12)/1.4,mid.clientWidth*.44,max)}
  else{let other=0;[...mid.children].forEach(ch=>{if(ch!==bw)other+=ch.getBoundingClientRect().height});W=Math.min((mid.clientHeight-other-34)/1.4,mid.clientWidth*.86,max)}
  W=Math.max(80,W);
  bw.style.setProperty('--W',W+'px');
}
function bindStageSwipe(){
  const st=$('#stg');if(!st)return;let y0=null,dy=0;
  st.addEventListener('touchstart',e=>{if(e.target.closest('button')&&!e.target.closest('.pyrbtn')){}y0=e.touches[0].clientY;dy=0;st.style.transition='none'},{passive:true});
  st.addEventListener('touchmove',e=>{if(y0===null)return;dy=e.touches[0].clientY-y0;if(dy>0){st.style.transform=`translateY(${dy}px)`;st.style.opacity=String(Math.max(.4,1-dy/600));if(e.cancelable)e.preventDefault()}},{passive:false});
  st.addEventListener('touchend',()=>{
    if(y0===null)return;y0=null;st.style.transition='transform .25s ease-out,opacity .25s';
    if(dy>110){st.style.transform='translateY(100%)';st.style.opacity='0';setTimeout(()=>{closeStage();render()},220)}
    else{st.style.transform='';st.style.opacity=''}
  });
}
let rzT;function setVH(){document.documentElement.style.setProperty('--vh',window.innerHeight+'px');if($('#stg'))fitBig();clearTimeout(rzT);rzT=setTimeout(()=>{if(MODE==='chu'&&!$('#game').hidden&&!$('#stg'))renderChu()},150)}
window.addEventListener('resize',setVH);setVH();
function closeStage(){$('#stage').innerHTML='';document.body.classList.remove('lock')}
function replayAsk(){
  modal(`<div class="center"><h2>Nouvelle partie ?</h2><p class="hint">Mêmes joueurs, même mode, nouvelles cartes.</p></div>
  <div class="row2"><button class="btn lg" onclick="closeModal()">Non</button><button class="btn gold lg" onclick="start()">Rejouer</button></div>`);
}
function playersAsk(){
  modal(`<div class="center"><h2>Retour à l'accueil ?</h2><p class="hint">Pour changer les joueurs, le mode ou les réglages.</p></div>
  <div class="row2"><button class="btn lg" onclick="closeModal()">Non</button><button class="btn gold lg" onclick="toSetup()">Oui</button></div>`);
}
function quitAsk(){
  modal(`<div class="center"><h2>Quitter la partie ?</h2><p class="hint">La partie en cours sera perdue.</p></div>
  <div class="row2"><button class="btn lg" onclick="closeModal()">Continuer</button><button class="btn red lg" onclick="toSetup()">Quitter</button></div>`);
}
function toSetup(){liveStop();closeModal();closeStage();$('#game').hidden=true;$('#dock').hidden=true;document.body.classList.remove('ingame');$('#setup').hidden=false;renderSetup();window.scrollTo(0,0)}

function rules(){
  const m=$('#game').hidden?S.mode:MODE,ie=m==='ie';  // sans jeu choisi : règles de la Pyramide
  if(m==='chu'){modal(`<h2>Règles · Cheucheuille</h2>
  <ul class="rules">
    <li><b>Le cercle.</b> Toutes les cartes sont étalées en cercle autour du verre du milieu. Chacun son tour touche une carte pour la piocher.</li>
    <li><b>Attention au trou.</b> Si en prenant ta carte tu ouvres un trou dans le cercle, c'est cul sec.</li>
    <li><b>As :</b> cul sec. <b>3 :</b> « Dans ma valise il y a… ». <b>6 :</b> le joueur d'avant boit. <b>7 :</b> tournée générale. <b>8 :</b> le joueur d'après boit. <b>2, 4, 5, 9 :</b> rien.</li>
    <li><b>Les pouvoirs.</b> 10 : Roi des pouces. Valet : Cheucheuille (tout le monde se tape la tête, le dernier boit). Dame : Freeze (celui qui bouge boit). C'est le dernier qui a tiré la carte qui garde le pouvoir.</li>
    <li><b>Roi :</b> on verse ce qu'on veut dans le verre du milieu. Celui qui tire le 4<sup>e</sup> Roi le boit, et la partie s'arrête.</li>
  </ul><button class="btn gold block lg" onclick="closeModal()">Compris</button>`);return}
  modal(ie?`<h2>Règles · Inter-Exter</h2>
  <ul class="rules">
    <li><b>1. La distribution.</b> Tour de table : chacun répond à la question 1, puis tout le monde passe à la question 2, etc. Une carte est tirée à chaque réponse : <b>Rouge ou noir ?</b> · <b>Plus ou moins</b> que la 1<sup>re</sup> ? · <b>Inter ou exter</b> : entre les 2 premières ou en dehors ? · <b>Trèfle, pique, carreau ou cœur ?</b></li>
    <li><b>Gagné ou raté.</b> Bonne réponse : tu donnes les gorgées de la question (1, 2, 3 puis 4). Mauvaise : tu les bois. Égalité = perdu.</li>
    <li><b>2. Le plateau.</b> Deux lignes de cartes. On retourne colonne par colonne : ligne du haut, ceux qui ont la même valeur <b>donnent</b> ; ligne du bas, ils <b>boivent</b>. Les gorgées montent à chaque colonne, et comptent double si tu as la carte en double.</li>
    <li><b>Les cartes de tous sont visibles</b> : l'appli dit toute seule qui donne et qui boit.</li>
    <li><b>La dernière colonne</b> : un cul sec à donner, puis un cul sec à boire.</li>
  </ul><button class="btn gold block lg" onclick="closeModal()">Compris</button>`
  :`<h2>Règles · La Pyramide</h2>
  <ul class="rules">
    <li><b>Mise en place.</b> Chacun reçoit des cartes secrètes à mémoriser. Les autres cartes forment la pyramide.</li>
    <li><b>Tour de jeu.</b> On retourne les cartes du bas vers le haut. Les gorgées montent à chaque rangée.</li>
    <li><b>Tu as la carte ?</b> Distribue les gorgées à voix haute. Plusieurs joueurs peuvent l'avoir.</li>
    <li><b>Le bluff.</b> Tu peux mentir. Un doute : touche le nom du joueur, l'appli montre seulement la carte en jeu. Bluffeur démasqué : il boit le double. Sinon, l'accusateur boit le double.</li>
    <li><b>Revoir ses cartes</b> (bouton Mes cartes, si l'option est activée) coûte les gorgées de la rangée en cours : 2 secondes pour regarder, puis 2 minutes avant de pouvoir recommencer.</li>
    <li><b>Le sommet.</b> Avant de le retourner, chacun annonce ses cartes de mémoire : une erreur = cul sec. Puis ceux qui ont la carte du sommet boivent cul sec.</li>
  </ul><button class="btn gold block lg" onclick="closeModal()">Compris</button>`);
}

function modal(inner,still=false){
  $('#modal').innerHTML=`<div class="ov${still?' still':''}" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"><div class="shead"><div class="grab"></div><button class="sx" onclick="closeModal()" aria-label="Fermer">✕</button></div>${inner}</div></div>`;
  bindSwipe();
}
function closeModal(){$('#modal').innerHTML='';appOpen=false}
function bindSwipe(){
  const sh=$('#sheet');if(!sh)return;let y0=null,dy=0;
  sh.addEventListener('touchstart',e=>{
    if(e.target.closest('.hold')||e.target.closest('.olist')||e.target.closest('.sx')||(sh.scrollTop>0&&!e.target.closest('.shead'))){y0=null;return}
    y0=e.touches[0].clientY;dy=0;sh.style.transition='none';
  },{passive:true});
  sh.addEventListener('touchmove',e=>{
    if(y0===null)return;dy=e.touches[0].clientY-y0;
    if(dy>0){sh.style.transform=`translateY(${dy}px)`;if(e.cancelable)e.preventDefault()}
  },{passive:false});
  sh.addEventListener('touchend',()=>{
    if(y0===null)return;y0=null;sh.style.transition='transform .22s ease-out';
    if(dy>90){sh.style.transform='translateY(110%)';setTimeout(closeModal,200)}else sh.style.transform='';
  });
}
let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2000)}

renderSetup();
</script>
